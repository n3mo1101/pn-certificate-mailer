<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Certificate Mailer</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="{% static 'img/nexus_text_logo.png' %}" class="logo" alt="Nexus Logo">
                <h1>Certificate Mail</h1>
                <p>Please sign in to continue</p>
            </div>
            
            <div class="login-body">
                {% if form.errors %}
                    <div class="error-message">
                        <strong>Login Failed:</strong> Invalid username or password.
                    </div>
                {% endif %}
                
                <form method="post" class="login-form">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label for="id_username">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control" required autofocus placeholder="Enter your username">
                    </div>
                    
                    <div class="form-group">
                        <label for="id_password">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control" required placeholder="Enter your password">
                    </div>
                    
                    <button type="submit" class="btn-login">Sign In</button>
                    <input type="hidden" name="next" value="{{ next }}">
                </form>
            </div>
            
            <div class="login-footer">
                Powered by <strong style="color: var(--primary-green);">Project Nexus</strong>
            </div>
        </div>
    </div>
</body>
</html>
